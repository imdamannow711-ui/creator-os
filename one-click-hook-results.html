<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DONE RITE Hook Results</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#11151c;border:1px solid #2a3442;border-radius:18px;padding:16px;margin-bottom:12px}.input,.select,.btn{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3442;background:#171c25;color:#fff;font-size:16px;margin:6px 0 12px}.btn{background:#146fd1;font-weight:900}.help{color:#8793a1;font-size:13px}.ok{color:#2bd97c;font-weight:900}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.leader{padding:12px;border-bottom:1px solid #2a3442}.leader:last-child{border:0}@media(max-width:430px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Hook Results</h1><p class="help">Enter performance for a finished One-Click video. Data stays in this browser.</p><div class="card"><label>Finished hook/video</label><select id="assignment" class="select"></select><div id="hookInfo" class="help"></div><div class="row"><div><label>Views</label><input id="views" class="input" type="number" min="0" inputmode="numeric"></div><div><label>Avg watch time (sec)</label><input id="watch" class="input" type="number" min="0" step="0.1" inputmode="decimal"></div><div><label>Completion rate (%)</label><input id="completion" class="input" type="number" min="0" max="100" step="0.1" inputmode="decimal"></div><div><label>Clicks</label><input id="clicks" class="input" type="number" min="0" inputmode="numeric"></div><div><label>Orders</label><input id="orders" class="input" type="number" min="0" inputmode="numeric"></div><div><label>Commission</label><input id="commission" class="input" type="number" min="0" step="0.01" inputmode="decimal"></div></div><button id="save" class="btn">SAVE RESULT</button><div id="status" class="help"></div></div><div class="card"><h2>Hook leaderboard</h2><div id="leaderboard" class="help">No results yet.</div></div></div><script src="modules/performance-engine.js"></script><script>(function(){'use strict';const HOOK_KEY='done-rite-one-click-hook-tests:v1',$=id=>document.getElementById(id);function state(){try{return Object.assign({assignments:[]},JSON.parse(localStorage.getItem(HOOK_KEY)||'{}'));}catch(e){return{assignments:[]};}}function assignments(){return state().assignments||[];}function fill(){const a=assignments(),sel=$('assignment');sel.innerHTML='';if(!a.length){const o=document.createElement('option');o.textContent='No hook tests found on this device';o.value='';sel.appendChild(o);$('save').disabled=true;return;}a.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=(x.hookId||'Hook')+' • '+(x.videoFileName||x.product||'video');sel.appendChild(o);});$('save').disabled=false;showInfo();}function current(){return assignments().find(x=>x.id===$('assignment').value)||null;}function showInfo(){const x=current();$('hookInfo').textContent=x?(x.hookText+' • '+(x.product||'')+' • '+(x.createdAt?new Date(x.createdAt).toLocaleString():'')):'No assignment selected.';}function renderBoard(){const rows=window.DoneRitePerformance.hookLeaderboard();const box=$('leaderboard');if(!rows.length){box.textContent='No results yet.';return;}box.innerHTML='';rows.forEach((x,i)=>{const d=document.createElement('div');d.className='leader';d.innerHTML='<b>#'+(i+1)+' '+(x.hookId||'Hook')+'</b><div>'+String(x.hookText||'')+'</div><div class="help">Posts '+x.posts+' • Views '+Math.round(x.views)+' • Avg watch '+x.avgWatchTime.toFixed(1)+'s • Completion '+x.avgCompletionRate.toFixed(1)+'% • Clicks '+x.clicks+' • Orders '+x.orders+'</div>';box.appendChild(d);});}$('assignment').addEventListener('change',showInfo);$('save').addEventListener('click',()=>{const x=current();if(!x)return;const r=window.DoneRitePerformance.add({platform:x.platform||'TikTok Shop',product:x.product||'',format:'One-Click Ad',hook:x.hookText||'',hookText:x.hookText||'',hookAssignmentId:x.id,hookId:x.hookId||'',videoFileName:x.videoFileName||'',views:$('views').value,avgWatchTime:$('watch').value,completionRate:$('completion').value,clicks:$('clicks').value,orders:$('orders').value,commission:$('commission').value,attribution:Number($('orders').value||0)>0?'Video':'Unknown'});if(window.DoneRiteOneClickAdEditor&&window.DoneRiteOneClickAdEditor.recordHookResult)window.DoneRiteOneClickAdEditor.recordHookResult(x.id,r);$('status').className='ok';$('status').textContent='Saved. Leaderboard updated.';renderBoard();});fill();renderBoard();})();</script></body></html>
