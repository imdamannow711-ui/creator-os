<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DONE RITE One-Click Ad Dev</title>
<style>
body{margin:0;background:#080a0e;color:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 16px 40px}.card{background:#11151c;border:1px solid #2a3442;border-radius:18px;padding:16px;margin-bottom:12px}.button{width:100%;min-height:52px;border:1px solid #58a6ff;border-radius:14px;background:linear-gradient(135deg,#1e7bff,#0f4fa8);color:#fff;font-size:17px;font-weight:900}.input,.select{width:100%;margin-top:7px;margin-bottom:12px;padding:13px;border-radius:12px;border:1px solid #2a3442;background:#171c25;color:#fff;font-size:16px}.label{font-size:12px;color:#c4ccd6;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.help{color:#8793a1;font-size:13px;line-height:1.45}.out{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.45}h1{font-size:22px;margin:8px 0 4px}.pill{display:inline-block;border:1px solid #2a3442;border-radius:999px;padding:5px 9px;color:#58a6ff;font-size:12px;margin-bottom:8px}</style>
</head>
<body>
<div class="wrap">
  <div class="pill">DEVELOPMENT ONLY — LIVE APP UNTOUCHED</div>
  <h1>ONE-CLICK AD</h1>
  <p class="help">Raw-footage intake and deterministic ad-plan test harness.</p>
  <div class="card">
    <label class="label">Raw video</label>
    <input id="video" class="input" type="file" accept="video/*">
    <label class="label">Product</label>
    <input id="product" class="input" value="Test Product">
    <label class="label">Verified feature</label>
    <input id="feature" class="input" value="clamp-on hands-free filming">
    <label class="label">Mode</label>
    <select id="mode" class="select"><option value="AUTO_SELL">AUTO SELL</option><option value="AUTO_HOOK">AUTO HOOK</option><option value="AUTO_CLEAN">AUTO CLEAN</option></select>
    <label class="label">Duration</label>
    <select id="duration" class="select"><option>7</option><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option></select>
    <button id="go" class="button">CREATE POST-READY PLAN</button>
  </div>
  <div class="card"><strong>Video intake</strong><div id="media" class="out help">No video selected.</div></div>
  <div class="card"><strong>Edit + compliance plan</strong><div id="out" class="out help">Tap the button to generate the plan.</div></div>
</div>
<script src="modules/one-click-ad-editor.js"></script>
<script>
const video=document.getElementById('video'), media=document.getElementById('media'), out=document.getElementById('out');
video.addEventListener('change',()=>{
 const f=video.files&&video.files[0];
 if(!f){media.textContent='No video selected.';return;}
 media.textContent=`${f.name}\n${f.type||'video'}\n${(f.size/1024/1024).toFixed(1)} MB\nRaw file stays local in this development harness.`;
});
document.getElementById('go').addEventListener('click',()=>{
 const f=video.files&&video.files[0];
 const plan=window.DoneRiteOneClickAdEditor.createPlan({
  productName:document.getElementById('product').value,
  verifiedFeature:document.getElementById('feature').value,
  mode:document.getElementById('mode').value,
  durationSeconds:document.getElementById('duration').value,
  category:'Electronics & Gadgets',batteryPowered:true,
  hashtags:['#Gadgets','#TikTokShop']
 });
 plan.rawMedia=f?{name:f.name,type:f.type,sizeBytes:f.size}:null;
 out.textContent=JSON.stringify(plan,null,2);
});
</script>
</body>
</html>
