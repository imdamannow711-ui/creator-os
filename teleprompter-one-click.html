<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071116">
<title>DONE RITE One-Click Teleprompter</title>
<style>
html,body{margin:0;min-height:100%;background:#05070b;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:540px;padding:20px;border:1px solid #2a4058;border-radius:18px;background:#0b1522}.title{font-weight:950;color:#72bdff;font-size:20px}.help{margin-top:10px;color:#a9b8c9;line-height:1.5}
</style>
<link rel="stylesheet" href="styles/smoked-glass-theme.css?v=20260914-smoked-glass-1">
</head>
<body>
<div class="load"><div class="card"><div class="title">⚡ Loading ONE CLICK Teleprompter…</div><div class="help">Preserving the recording session and using the least-processed microphone capture Safari allows.</div></div></div>
<script>
(async()=>{
  try{
    const query=new URLSearchParams(location.search),HANDOFF_KEY='done-rite-one-click-teleprompter-handoff:v1';let handoff={};
    if(query.get('handoff')==='1'){
      try{handoff=JSON.parse(localStorage.getItem(HANDOFF_KEY)||'{}')||{};}catch(e){handoff={};}
      ['script','product','seconds','type','tone','return','back'].forEach(key=>{const value=query.get(key);if(value!=null&&value!=='')handoff[key]=value;});
      if(!String(handoff.script||'').trim())throw new Error('The connected script was not found. Return to One-Click and tap Open Script in Teleprompter again.');
    }
    const response=await fetch('teleprompter.html',{cache:'no-store'});
    if(!response.ok)throw new Error('Teleprompter source returned '+response.status);
    let html=await response.text();
    const oldSession="function applyRecordingSession(){const p=new URLSearchParams(location.search),sessionScript=p.get('script')||p.get('text')||'',";
    const newSession="function applyRecordingSession(){const queryParams=new URLSearchParams(location.search),handoff=window.DoneRiteTeleprompterHandoff||{},p={get:key=>queryParams.get(key)??handoff[key]??null},sessionScript=p.get('script')||p.get('text')||'',";
    if(query.get('handoff')==='1'){
      if(!html.includes(oldSession))throw new Error('The Teleprompter session bridge needs an update.');
      html=html.replace(oldSession,newSession);
      const encoded=JSON.stringify(handoff).replace(/</g,'\\u003c');
      const buildScript=/<script>\s*const BUILD=/;
      if(!buildScript.test(html))throw new Error('The Teleprompter handoff could not be installed.');
      html=html.replace(buildScript,'<script>window.DoneRiteTeleprompterHandoff='+encoded+';<\\/script><script>\nconst BUILD=');
    }
    const oldConstraints='echoCancellation:true,noiseSuppression:true,autoGainControl:true';
    const rawConstraints='echoCancellation:false,noiseSuppression:false,autoGainControl:false';
    if(!html.includes(oldConstraints))throw new Error('Expected Teleprompter microphone settings were not found. The wrapper stopped rather than changing unknown code.');
    html=html.replace(oldConstraints,rawConstraints);
    const bridge=`<script>(function(){
      const p=new URLSearchParams(location.search),handoff=window.DoneRiteTeleprompterHandoff||{},ret=p.get('return')||handoff.return||'',back=p.get('back')||handoff.back||'';
      const safe=(raw)=>{try{const u=new URL(raw,location.href);return u.origin===location.origin?u.href:'';}catch(e){return'';}};
      const safeReturn=safe(ret),safeBack=safe(back)||safeReturn;
      const applyConnectedSession=()=>{
        if(p.get('handoff')!=='1')return;
        const script=String(p.get('script')||'').trim(),product=String(p.get('product')||'').trim(),seconds=String(p.get('seconds')||'7'),type=String(p.get('type')||'full'),tone=String(p.get('tone')||'confident');
        if(script){if(typeof window.setBothScripts==='function')window.setBothScripts(script,false,false);else{const scriptBox=document.getElementById('script'),coachBox=document.getElementById('coachLine');if(scriptBox)scriptBox.value=script;if(coachBox)coachBox.value=script;}}
        const productBox=document.getElementById('voiceProduct'),durationBox=document.getElementById('voiceDuration'),typeBox=document.getElementById('clipType'),toneBox=document.getElementById('tone');
        if(productBox)productBox.value=product;if(durationBox)durationBox.value=seconds;if(typeBox)typeBox.value=type;if(toneBox)toneBox.value=tone;
        if(typeof window.updateTone==='function')window.updateTone();if(typeof window.updateReadouts==='function')window.updateReadouts();if(typeof window.showNextName==='function')window.showNextName();if(typeof window.save==='function')window.save();
      };
      const applyNav=()=>{
        applyConnectedSession();
        if(!document.getElementById('doneRiteTeleBack')){
          const b=document.createElement('button');b.id='doneRiteTeleBack';b.type='button';b.textContent='← BACK TO ONE-CLICK';b.setAttribute('aria-label','Back to One-Click');b.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;z-index:99999;min-height:42px;padding:9px 13px;border:1px solid #344457;border-radius:12px;background:rgba(23,29,39,.96);color:#cfe7ff;font:900 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.35)';b.onclick=()=>{if(safeBack){location.href=safeBack;return;}location.href='index.html';};document.body.appendChild(b);
        }
        if(safeReturn){
          const topLink=document.querySelector('.creator-os-float-return');
          if(topLink){topLink.href=safeReturn;topLink.setAttribute('aria-label','Return to One-Click Editor');topLink.title='Return to One-Click Editor';const label=topLink.querySelector('span:last-child');if(label)label.textContent='One-Click';}
          const result=document.getElementById('result');
          if(result&&!document.getElementById('doneRiteReturnOneClick')){
            const a=document.createElement('a');a.id='doneRiteReturnOneClick';a.href=safeReturn;a.className='download';a.textContent='RETURN TO ONE-CLICK EDITOR →';a.style.background='#168a50';a.style.border='1px solid #48d98d';result.appendChild(a);
          }
        }
      };
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',applyNav,{once:true});else applyNav();
    })();<\/script>`;
    html=html.replace('</body>',bridge+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="load"><div class="card"><div class="title" style="color:#ff7b86">Teleprompter did not open</div><div class="help"></div></div></div>';
    document.querySelector('.help').textContent=err&&err.message?err.message:String(err);
  }
})();
</script>
</body>
</html>
