<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DONE RITE Creator OS smoked-glass One-Click console</title>
  <desc id="desc">A wet smoked-glass control room with a luminous cross, chrome framing, and eight integrated rim-lit glass controls.</desc>
  <defs>
    <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020608"/><stop offset=".48" stop-color="#14232b"/><stop offset="1" stop-color="#05090c"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38505c" stop-opacity=".68"/><stop offset=".32" stop-color="#14232b" stop-opacity=".78"/><stop offset="1" stop-color="#050b0f" stop-opacity=".93"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#fff"/><stop offset=".3" stop-color="#fff0ae"/><stop offset=".58" stop-color="#e0ae40"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#bc7f19"/></linearGradient>
    <linearGradient id="chrome"><stop stop-color="#eafbff"/><stop offset=".28" stop-color="#4d626d"/><stop offset=".5" stop-color="#c5edf9"/><stop offset=".76" stop-color="#263941"/><stop offset="1" stop-color="#a8def1"/></linearGradient>
    <radialGradient id="drop" cx="30%" cy="22%"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".2" stop-color="#e6faff" stop-opacity=".18"/><stop offset=".78" stop-color="#04090c" stop-opacity=".2"/><stop offset="1" stop-color="#aee5f8" stop-opacity=".22"/></radialGradient>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="dropShadow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".75"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#smoke)"/>
  <ellipse cx="800" cy="-90" rx="520" ry="360" fill="#72d4ff" fill-opacity=".10"/>
  <path d="M650 0 510 380h180L760 0zm245 0-70 390h180L980 0z" fill="#fff0b3" opacity=".055"/>
  <path d="M160 0 133 65l31 34-61 75 26 45-73 112M1440 0l27 65-31 34 61 75-26 45 73 112" fill="none" stroke="#4bc7ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#blueGlow)"/>
  <rect x="48" y="42" width="1504" height="812" rx="46" fill="#0b151a" fill-opacity=".64" stroke="url(#chrome)" stroke-width="8"/>
  <rect x="62" y="56" width="1476" height="784" rx="36" fill="none" stroke="#d8f7ff" stroke-opacity=".15" stroke-width="2"/>
  <text x="800" y="92" text-anchor="middle" fill="#ffe7a5" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="10">FAITH • INTEGRITY • SERVICE • EXCELLENCE</text>
  <text x="800" y="146" text-anchor="middle" fill="#f4fbff" font-family="Arial Black,Arial,sans-serif" font-size="52" font-weight="900" letter-spacing="5">DONE <tspan fill="#ffe4a0">RITE</tspan> CREATOR OS</text>
  <text x="800" y="190" text-anchor="middle" fill="#65ceff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" letter-spacing="8">ONE-CLICK WET-GLASS CONSOLE</text>
