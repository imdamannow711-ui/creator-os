    <g transform="translate(354 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#58ccff" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><text x="69.5" y="48" fill="#73d6ff" font-size="31">☁</text><text x="69.5" y="88" fill="#fff" font-size="18" font-weight="900">UPLOAD</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">RAW CLIPS</text></g>
    <g transform="translate(506 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#58ccff" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><text x="69.5" y="49" fill="#73d6ff" font-size="32" font-weight="900">T</text><text x="69.5" y="88" fill="#fff" font-size="18" font-weight="900">TEXT</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">SCRIPT TOOLS</text></g>
    <g transform="translate(656 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#ffe5a0" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><circle cx="69.5" cy="43" r="19" fill="#ffe5a0"/><rect x="64" y="57" width="11" height="17" rx="5" fill="#ffe5a0"/><text x="69.5" y="88" fill="#fff" font-size="15" font-weight="900">VOICEOVER</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">VOICE TOOLS</text></g>
    <g transform="translate(808 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#58ccff" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><text x="69.5" y="50" fill="#73d6ff" font-size="34">✂</text><text x="69.5" y="88" fill="#fff" font-size="15" font-weight="900">AUTO TRIM</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">REVIEW CUTS</text></g>
    <g transform="translate(958 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#58ccff" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><text x="69.5" y="49" fill="#73d6ff" font-size="32">▥</text><text x="69.5" y="88" fill="#fff" font-size="18" font-weight="900">SFX</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">SOUND</text></g>
    <g transform="translate(1110 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#ffe5a0" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><text x="69.5" y="49" fill="#ffe5a0" font-size="32">⚙</text><text x="69.5" y="88" fill="#fff" font-size="18" font-weight="900">RENDER</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">BUILD VIDEO</text></g>
    <g transform="translate(1262 218)"><rect width="139" height="132" rx="20" fill="url(#glass)" stroke="#ffe5a0" stroke-width="4"/><path d="M12 12h115" stroke="#fff" stroke-opacity=".3"/><text x="69.5" y="49" fill="#ffe5a0" font-size="34">⇧</text><text x="69.5" y="88" fill="#fff" font-size="18" font-weight="900">EXPORT</text><text x="69.5" y="110" fill="#b6ccd6" font-size="11">SAVE &amp; SHARE</text></g>
  </g>
  <path d="M800 408 928 456v82c0 80-50 126-128 154-78-28-128-74-128-154v-82z" fill="#071116" stroke="#53c9ff" stroke-width="7"/>
  <path d="M775 433h50v61h61v50h-61v105h-50V544h-61v-50h61z" fill="url(#gold)" stroke="#fff" stroke-width="10" filter="url(#goldGlow)"/>
  <path d="m692 526 23-25-8 38 25-8-40 54 12-40-23 9zm216 0-23-25 8 38-25-8 40 54-12-40 23 9z" fill="#4bc9ff" filter="url(#blueGlow)"/>
  <text x="800" y="754" text-anchor="middle" fill="#f2f9fc" font-family="Arial Black,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="4">CREATE WITH PURPOSE</text>
  <text x="800" y="796" text-anchor="middle" fill="#b3c6cf" font-family="Arial,Helvetica,sans-serif" font-size="22" font-style="italic" letter-spacing="2">Real Reviews. Real Gadgets. Done Rite.</text>
  <g fill="url(#drop)" stroke="#dff7ff" stroke-opacity=".22"><ellipse cx="115" cy="121" rx="15" ry="21"/><ellipse cx="292" cy="73" rx="8" ry="11"/><ellipse cx="472" cy="486" rx="24" ry="31"/><ellipse cx="1083" cy="92" rx="12" ry="17"/><ellipse cx="1458" cy="462" rx="20" ry="27"/><ellipse cx="1242" cy="716" rx="11" ry="15"/><ellipse cx="235" cy="741" rx="27" ry="35"/><ellipse cx="1010" cy="654" rx="7" ry="10"/></g>
