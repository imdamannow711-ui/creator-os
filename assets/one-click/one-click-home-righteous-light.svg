<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DONE RITE Creator OS One-Click Ad Builder</title>
  <desc id="desc">A bright white, sky blue, chrome, and gold Creator OS control room beneath rays of light and blue lightning.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset=".58" stop-color="#f9fcff"/><stop offset="1" stop-color="#d5eaff"/></linearGradient>
    <linearGradient id="chrome"><stop stop-color="#fff"/><stop offset=".35" stop-color="#91a6bc"/><stop offset=".53" stop-color="#fff"/><stop offset="1" stop-color="#7790aa"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5cc6ff"/><stop offset="1" stop-color="#0872dc"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6c3"/><stop offset=".5" stop-color="#e7b638"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#c88b14"/></linearGradient>
    <radialGradient id="light" cx="50%" cy="0" r="70%"><stop stop-color="#fffef1"/><stop offset=".35" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="700" fill="url(#light)"/>
