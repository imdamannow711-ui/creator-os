<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">DONE RITE Network</title>
  <desc id="desc">DONE RITE Network logo with a radiant cross crest and the values Faith, Integrity, Service, and Excellence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#d8eeff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8cf"/><stop offset=".42" stop-color="#efc858"/><stop offset=".68" stop-color="#ffffff"/><stop offset="1" stop-color="#ce8d16"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".28" stop-color="#8092aa"/><stop offset=".52" stop-color="#f9fcff"/><stop offset=".78" stop-color="#657890"/><stop offset="1" stop-color="#e7f2ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
