  <rect x="8" y="8" width="1064" height="344" rx="72" fill="url(#bg)" stroke="url(#chrome)" stroke-width="12"/>
  <path d="M190 42 302 84v75c0 70-44 113-112 137-68-24-112-67-112-137V84z" fill="#dff2ff" stroke="#168cff" stroke-width="7"/>
  <g opacity=".82" stroke="#fff" stroke-linecap="round"><path d="M190 50v51" stroke-width="8"/><path d="m143 63 24 43" stroke-width="6"/><path d="m237 63-24 43" stroke-width="6"/></g>
  <path d="m114 153 21-20-9 35 24-8-39 49 12-37-23 8z" fill="#168cff" filter="url(#glow)"/>
  <path d="m266 153-21-20 9 35-24-8 39 49-12-37 23 8z" fill="#168cff" filter="url(#glow)"/>
  <path d="M170 82h40v50h50v39h-50v82h-40v-82h-50v-39h50z" fill="url(#gold)" stroke="#fff" stroke-width="8" filter="url(#glow)"/>
  <text x="350" y="145" fill="#102a4c" font-family="Arial Black,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="4">DONE RITE</text>
  <text x="354" y="204" fill="#168cff" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="800" letter-spacing="12">NETWORK</text>
