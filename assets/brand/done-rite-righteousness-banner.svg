<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">DONE RITE Creator OS layered righteousness banner</title>
  <desc id="desc">The full phrase Righteousness in the eyes of God casts a deep shadow over DONE, a luminous cross, and RITE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07151d"/><stop offset=".46" stop-color="#0d252f"/><stop offset="1" stop-color="#020609"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".2" stop-color="#9dd8f2"/><stop offset=".45" stop-color="#304d5c"/><stop offset=".7" stop-color="#e9fbff"/><stop offset="1" stop-color="#5e7f90"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".22" stop-color="#fff3bd"/><stop offset=".52" stop-color="#e8b94d"/><stop offset=".76" stop-color="#fff8d8"/><stop offset="1" stop-color="#b97a10"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="38%" r="62%">
      <stop stop-color="#fff6c8" stop-opacity=".42"/><stop offset=".36" stop-color="#57caff" stop-opacity=".15"/><stop offset="1" stop-color="#07151d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="drop" cx="32%" cy="25%">
      <stop stop-color="#ffffff" stop-opacity=".75"/><stop offset=".25" stop-color="#bcecff" stop-opacity=".18"/><stop offset="1" stop-color="#52b6dc" stop-opacity=".03"/>
    </radialGradient>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wordShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#000000" flood-opacity=".84"/>
    </filter>
    <filter id="sentenceShadow" x="-20%" y="-70%" width="140%" height="260%">
      <feDropShadow dx="0" dy="28" stdDeviation="7" flood-color="#000000" flood-opacity=".98"/>
      <feDropShadow dx="0" dy="13" stdDeviation="3" flood-color="#001018" flood-opacity=".9"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1580" height="500" rx="48" fill="url(#bg)" stroke="url(#chrome)" stroke-width="7"/>
  <rect x="25" y="25" width="1550" height="470" rx="38" fill="none" stroke="#50c8ff" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="800" cy="220" rx="470" ry="250" fill="url(#light)"/>
  <path d="m150 190 70-52-28 74 84-30-104 92 39-74-80 28zm1300 0-70-52 28 74-84-30 104 92-39-74 80 28z" fill="#45c5ff" opacity=".5" filter="url(#blueGlow)"/>
  <g fill="url(#drop)" stroke="#dff7ff" stroke-opacity=".23">
    <ellipse cx="84" cy="82" rx="15" ry="23"/><ellipse cx="265" cy="400" rx="10" ry="16"/><ellipse cx="1470" cy="84" rx="12" ry="19"/><ellipse cx="1335" cy="410" rx="17" ry="25"/>
  </g>

  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" filter="url(#wordShadow)">
    <text x="390" y="340" font-size="188" textLength="520" lengthAdjust="spacingAndGlyphs" fill="url(#chrome)" stroke="#61d2ff" stroke-width="4">DONE</text>
    <text x="1210" y="340" font-size="188" textLength="520" lengthAdjust="spacingAndGlyphs" fill="url(#chrome)" stroke="#61d2ff" stroke-width="4">RITE</text>
  </g>

  <g filter="url(#goldGlow)">
    <path d="M758 112h84v102h128v84H842v126h-84V298H630v-84h128z" fill="#fff8d2" stroke="#ffffff" stroke-width="16"/>
  </g>
  <path d="M758 112h84v102h128v84H842v126h-84V298H630v-84h128z" fill="url(#gold)" stroke="#e1ad3f" stroke-width="5"/>
  <path d="M790 124h20v286h-20z" fill="#ffffff" opacity=".55"/>

  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" filter="url(#sentenceShadow)">
    <text x="800" y="266" font-size="49" textLength="1160" lengthAdjust="spacingAndGlyphs" fill="#fff0b8" stroke="#ffffff" stroke-width="2">RIGHTEOUSNESS IN THE EYES OF GOD</text>
  </g>

  <text x="800" y="458" text-anchor="middle" fill="#bdeeff" font-family="Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="7">FAITH • INTEGRITY • SERVICE • EXCELLENCE</text>
  <text x="800" y="497" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">NOT ONLY DONE WELL. DONE RITE.</text>
</svg>