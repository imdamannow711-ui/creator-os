<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070b">
<title>DONE RITE Teleprompter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b;color:#f5f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.setup{width:min(760px,100%);margin:auto;padding:18px 14px calc(84px + env(safe-area-inset-bottom))}.brand{font-weight:950;letter-spacing:.1em;color:#55adff}.card{background:#10151d;border:1px solid #293544;border-radius:18px;padding:16px;margin:12px 0;overflow:hidden}h1{font-size:25px;margin:7px 0}.help{color:#9aa7b6;line-height:1.5}.label{display:block;font-weight:850;margin:14px 0 7px}.script{width:100%;min-height:245px;resize:vertical;padding:15px;background:#090d13;color:#fff;border:1px solid #344457;border-radius:14px;font:700 23px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.range{width:100%;accent-color:#258cff}.readout{display:flex;justify-content:space-between;gap:10px;color:#69b8ff;font-weight:850;margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;min-height:52px;border:1px solid #57adff;border-radius:13px;background:#197aff;color:#fff;font:900 17px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-top:12px}.btn.secondary{background:#171d27;color:#72bdff;border-color:#344457}.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:750}.check input{width:22px;height:22px;accent-color:#258cff}a{text-decoration:none;color:inherit}
.stage{position:fixed;inset:0;background:#020305;display:none;overflow:hidden}.stage.active{display:block}.guide{position:absolute;left:0;right:0;top:43%;height:15%;border-top:2px solid #1e8cff;border-bottom:2px solid #1e8cff;background:linear-gradient(90deg,transparent,#1688ff15,transparent);pointer-events:none;z-index:2}.prompt{position:absolute;left:7vw;right:7vw;top:52vh;padding-bottom:75vh;font-weight:850;font-size:54px;line-height:1.42;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 3px 8px #000;will-change:transform}.prompt.mirror{transform:scaleX(-1)}.controls{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}.controls button{min-height:51px;border:1px solid #344457;border-radius:13px;background:#111823e8;color:#fff;font:900 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;backdrop-filter:blur(8px)}.controls .play{background:#197affe6;border-color:#58adff}.topbar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:5;display:flex;justify-content:space-between;gap:8px}.pill{border:1px solid #344457;border-radius:999px;background:#0b1019dd;color:#cfe7ff;padding:8px 12px;font-weight:850;font-size:14px}.countdown{position:fixed;inset:0;z-index:10;background:#020305e8;display:none;place-items:center;font-size:35vw;font-weight:950;color:#55adff;text-shadow:0 0 35px #1688ff}.countdown.show{display:grid}.hide-ui .controls,.hide-ui .topbar{opacity:.08}.hide-ui .controls:active,.hide-ui .topbar:active{opacity:1}
@media(max-width:480px){.prompt{left:6vw;right:6vw}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="setup" class="setup">
 <div class="brand">⚡ DONE RITE CREATOR OS</div>
 <h1>Extra-Slow Teleprompter</h1>
 <div class="card">
  <p class="help">Paste or type your voiceover. Your script and reading settings save automatically on this iPhone.</p>
  <label class="label" for="script">Voiceover script</label>
  <textarea id="script" class="script">Your phone audio needs this. The Hollyland LARK A1 is a compact wireless mic kit with a convenient charging case. See it in the product link.</textarea>
  <label class="label" for="speed">Scroll speed</label>
  <input id="speed" class="range" type="range" min="1" max="30" value="5">
  <div class="readout"><span>Very slow</span><span id="speedValue">5</span><span>Faster</span></div>
  <label class="label" for="font">Text size</label>
  <input id="font" class="range" type="range" min="30" max="86" value="58">
  <div class="readout"><span>Smaller</span><span id="fontValue">58 px</span><span>Larger</span></div>
  <label class="check"><input id="countdownToggle" type="checkbox" checked>3-second countdown before scrolling</label>
  <label class="check"><input id="mirror" type="checkbox">Mirror text for reflective teleprompter glass</label>
  <button id="start" class="btn">Start Teleprompter</button>
  <div class="row">
   <button id="practice" class="btn secondary">Start Without Scrolling</button>
   <button id="resetSettings" class="btn secondary">Reset Settings</button>
  </div>
 </div>
 <a href="./"><button class="btn secondary">Return to Creator OS</button></a>
</main>

<section id="stage" class="stage">
 <div class="guide"></div>
 <div id="prompt" class="prompt"></div>
 <div class="topbar"><button id="exit" class="pill">← Edit Script</button><div id="status" class="pill">Paused</div><button id="hide" class="pill">Hide Controls</button></div>
 <div class="controls"><button id="back">↶ Rewind</button><button id="play" class="play">▶ Start</button><button id="forward">Forward ↷</button></div>
 <div id="countdown" class="countdown">3</div>
</section>
<script>
const KEY='done-rite-teleprompter:v1',$=id=>document.getElementById(id);
let offset=0,running=false,last=0,raf=0;
function save(){localStorage.setItem(KEY,JSON.stringify({script:$('script').value,speed:$('speed').value,font:$('font').value,countdown:$('countdownToggle').checked,mirror:$('mirror').checked}))}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d.script)$('script').value=d.script;if(d.speed)$('speed').value=d.speed;if(d.font)$('font').value=d.font;if(typeof d.countdown==='boolean')$('countdownToggle').checked=d.countdown;if(typeof d.mirror==='boolean')$('mirror').checked=d.mirror}catch(e){}updateReadouts()}
function updateReadouts(){$('speedValue').textContent=$('speed').value;$('fontValue').textContent=$('font').value+' px'}
function applyOffset(){$('prompt').style.translate=`0 ${-offset}px`}
function tick(now){if(running){if(!last)last=now;const dt=Math.min(40,now-last);offset+=Number($('speed').value)*dt/38;applyOffset();last=now;const end=Math.max(0,$('prompt').scrollHeight-innerHeight*.46);if(offset>=end){offset=end;applyOffset();setRunning(false)}}raf=requestAnimationFrame(tick)}
function setRunning(on){running=on;last=0;$('play').textContent=on?'❚❚ Pause':'▶ Start';$('status').textContent=on?'Scrolling · Speed '+$('speed').value:'Paused'}
async function countIn(){if(!$('countdownToggle').checked)return;const c=$('countdown');c.classList.add('show');for(const n of [3,2,1]){c.textContent=n;await new Promise(r=>setTimeout(r,700))}c.textContent='GO';await new Promise(r=>setTimeout(r,450));c.classList.remove('show')}
async function openStage(auto){const text=$('script').value.trim();if(!text){$('script').focus();return}save();offset=0;$('prompt').textContent=text;$('prompt').style.fontSize=$('font').value+'px';$('prompt').classList.toggle('mirror',$('mirror').checked);applyOffset();$('setup').hidden=true;$('stage').classList.add('active');document.documentElement.requestFullscreen?.().catch(()=>{});setRunning(false);if(auto){await countIn();setRunning(true)}}
function closeStage(){setRunning(false);$('stage').classList.remove('active');$('setup').hidden=false;document.exitFullscreen?.().catch(()=>{});window.scrollTo(0,0)}
$('start').onclick=()=>openStage(true);$('practice').onclick=()=>openStage(false);$('play').onclick=()=>setRunning(!running);$('exit').onclick=closeStage;
$('back').onclick=()=>{offset=Math.max(0,offset-innerHeight*.28);applyOffset()};$('forward').onclick=()=>{offset+=innerHeight*.28;applyOffset()};
$('hide').onclick=()=>{$('stage').classList.toggle('hide-ui');$('hide').textContent=$('stage').classList.contains('hide-ui')?'Show Controls':'Hide Controls'};
$('resetSettings').onclick=()=>{$('speed').value=5;$('font').value=58;$('countdownToggle').checked=true;$('mirror').checked=false;updateReadouts();save()};
['script','speed','font','countdownToggle','mirror'].forEach(id=>$(id).addEventListener('input',()=>{updateReadouts();save()}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)setRunning(false)});load();raf=requestAnimationFrame(tick);
</script>
</body>
</html>
