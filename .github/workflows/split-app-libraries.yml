name: Split app libraries safely

on:
  push:
    branches:
      - split-app-libraries-2026-09-04

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract dashboard CSS and content libraries
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          original_size = len(app.encode('utf-8'))

          # 1) Extract the embedded dashboard CSS. Resolve COLORS.* interpolation
          # to the exact current color values so styling does not change.
          color_block = re.search(r'const COLORS = \{(.*?)\n\};', app, re.S)
          if not color_block:
              raise SystemExit('COLORS block not found; refusing to edit app.js')
          colors = dict(re.findall(r'\s*(\w+):\s*"([^"]+)",?', color_block.group(1)))
          css_match = re.search(r'const CSS = `([\s\S]*?)`;\nfunction uid\(\)', app)
          if not css_match:
              raise SystemExit('CSS block boundary not found exactly; refusing to edit app.js')
          css = css_match.group(1)
          for key, value in colors.items():
              css = css.replace('${COLORS.' + key + '}', value)
          if '${' in css:
              raise SystemExit('Unresolved CSS interpolation remains; refusing to split CSS')
          Path('styles').mkdir(exist_ok=True)
          Path('styles/dashboard.css').write_text(css.strip() + '\n', encoding='utf-8')
          app = app[:css_match.start()] + 'const CSS = "";\nfunction uid()' + app[css_match.end():]

          # 2) Extract only the self-contained hook/CTA/research/shot-pattern library.
          start_marker = '/* HOOK LIBRARY'
          end_marker = '/* Scores logged Content Gap phrases'
          start = app.find(start_marker)
          end = app.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Content-library boundaries not found exactly; refusing to edit app.js')
          block = app[start:end].rstrip()
          required = ['HOOK_LIBRARY','pickHooks','CTA_LIBRARY','hookOptions','ctaOptions','RESEARCH_NOTES','SHOT_PATTERNS']
          for name in required:
              if name not in block:
                  raise SystemExit(f'Required library symbol missing before split: {name}')
          module = """/* DONE RITE Creator OS — content libraries\n   Extracted from app.js without changing library text or selection behavior. */\n(function(){\n'use strict';\n""" + block + "\nwindow.DoneRiteContentLibraries={HOOK_LIBRARY,pickHooks,CTA_LIBRARY,hookOptions,ctaOptions,RESEARCH_NOTES,SHOT_PATTERNS};\n})();\n"
          Path('modules/creator-content-libraries.js').write_text(module, encoding='utf-8')
          bridge = "const { HOOK_LIBRARY, pickHooks, CTA_LIBRARY, hookOptions, ctaOptions, RESEARCH_NOTES, SHOT_PATTERNS } = window.DoneRiteContentLibraries || {};\nif (!HOOK_LIBRARY || !CTA_LIBRARY || !SHOT_PATTERNS) throw new Error('Creator content libraries did not load.');\n\n"
          app = app[:start] + bridge + app[end:]
          app_path.write_text(app, encoding='utf-8')

          # 3) Load CSS + content library before app.js.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'styles/dashboard.css' not in index:
              anchor = '<link rel="apple-touch-icon" href="icon-192.png" />'
              if anchor not in index:
                  raise SystemExit('index stylesheet anchor missing')
              index = index.replace(anchor, anchor + '\n<link rel="stylesheet" href="styles/dashboard.css" />', 1)
          lib_tag = '<script src="modules/creator-content-libraries.js"></script>'
          if lib_tag not in index:
              app_tag_match = re.search(r'<script src="app\.js[^\"]*"></script>', index)
              if not app_tag_match:
                  raise SystemExit('app.js script tag missing from index.html')
              index = index[:app_tag_match.start()] + lib_tag + '\n' + index[app_tag_match.start():]
          index_path.write_text(index, encoding='utf-8')

          # 4) Cache the new split files and force a fresh service-worker version.
          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'const CACHE_NAME = "[^"]+";', 'const CACHE_NAME = "done-rite-v22-split-app-libraries";', sw, count=1)
          for new_file in ['./styles/dashboard.css','./modules/creator-content-libraries.js']:
              if new_file not in sw:
                  anchor = '  "./app.js",\n'
                  if anchor not in sw:
                      raise SystemExit('service-worker app.js cache anchor missing')
                  sw = sw.replace(anchor, anchor + f'  "{new_file}",\n', 1)
          sw_path.write_text(sw, encoding='utf-8')

          new_size = len(app.encode('utf-8'))
          if new_size >= original_size:
              raise SystemExit('app.js did not get smaller; refusing split')
          print('app.js before:', original_size)
          print('app.js after :', new_size)
          print('reduction    :', original_size - new_size)
          print('dashboard.css:', Path('styles/dashboard.css').stat().st_size)
          print('content library:', Path('modules/creator-content-libraries.js').stat().st_size)

      - name: Syntax and library contract checks
        run: |
          node --check app.js
          node --check modules/creator-content-libraries.js
          node --check modules/one-click-browser-executor.js
          node --check modules/one-click-gap-remover.js
          node - <<'NODE'
          global.window = {};
          require('./modules/creator-content-libraries.js');
          const x = window.DoneRiteContentLibraries;
          if (!x) throw new Error('Library global missing');
          for (const k of ['HOOK_LIBRARY','CTA_LIBRARY','RESEARCH_NOTES','SHOT_PATTERNS']) {
            if (!Array.isArray(x[k]) || !x[k].length) throw new Error(k + ' missing/empty');
          }
          for (const k of ['pickHooks','hookOptions','ctaOptions']) {
            if (typeof x[k] !== 'function') throw new Error(k + ' is not a function');
          }
          console.log('content-library contract OK');
          NODE

      - name: Commit split result
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "DONE RITE Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html sw.js styles/dashboard.css modules/creator-content-libraries.js
          git commit -m "Split dashboard CSS and content libraries from app.js"
          git push
