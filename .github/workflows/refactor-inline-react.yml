name: Refactor inline React runtime

on:
  push:
    branches:
      - refactor-app-load-2026-09-04
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract offline React runtime from index shell
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '/* React 19 bundled for offline use — no CDN required */'
          if marker in text:
              pattern = re.compile(r'<script>\s*(/\* React 19 bundled for offline use — no CDN required \*/.*?</script>)', re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit('Inline React marker found but script block could not be isolated safely.')
              block = match.group(1)
              if not block.endswith('</script>'):
                  raise SystemExit('React script terminator check failed.')
              js = block[:-9].rstrip() + '\n'
              Path('vendor').mkdir(exist_ok=True)
              Path('vendor/react-offline.js').write_text(js, encoding='utf-8')
              text = text[:match.start()] + '<script src="vendor/react-offline.js"></script>' + text[match.end():]
              index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if './vendor/react-offline.js' not in sw_text:
              anchor = '  "./app.js",\n'
              if anchor not in sw_text:
                  raise SystemExit('Service worker app.js cache anchor not found.')
              sw_text = sw_text.replace(anchor, anchor + '  "./vendor/react-offline.js",\n', 1)
          sw_text = re.sub(r'const CACHE_NAME = "[^"]+";', 'const CACHE_NAME = "done-rite-v21-split-react-runtime";', sw_text, count=1)
          sw.write_text(sw_text, encoding='utf-8')

          final_index = index.read_text(encoding='utf-8')
          vendor = Path('vendor/react-offline.js').read_text(encoding='utf-8')
          assert '<div id="root">' in final_index
          assert 'app.js' in final_index
          assert 'window.React' in vendor and 'window.ReactDOM' in vendor
          assert marker in vendor
          print('index.html bytes:', index.stat().st_size)
          print('vendor/react-offline.js bytes:', Path('vendor/react-offline.js').stat().st_size)
          print('app.js bytes unchanged:', Path('app.js').stat().st_size)
      - name: JavaScript syntax checks
        run: |
          node --check vendor/react-offline.js
          node --check app.js
          node --check modules/one-click-browser-executor.js
          node --check modules/one-click-gap-remover.js
      - name: Commit refactor result
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "DONE RITE Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js vendor/react-offline.js
          git commit -m "Split offline React runtime out of index shell"
          git push
